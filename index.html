                    <label>Email Address:</label>
                    <input type="email" id="pEmail" required placeholder="Enter active email address">
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" id="pPhone" required placeholder="Enter active phone number">
                </div>
                <button type="submit" class="btn-submit">Proceed to Payment Gateway</button>
            </form>

            <!-- Step 2: HDFC / Razorpay UPI Hub -->
            <div id="gatewayHub" class="payment-gateway-box">
                <h3 style="color: #00ccff;">💳 Secure Razorpay / HDFC Gateway</h3>
                <p>Scan this QR code using any UPI App (GPay/PhonePe) to pay:</p>
                
                <div class="qr-code-container">
                    [ RAZORPAY / HDFC QR ]
                </div>
                
                <p style="margin: 15px 0; color: #aaa;">-- OR --</p>
                <button class="btn-submit" style="background-color: #00ccff; color: #000;" onclick="alert('Redirecting to Razorpay Card Checkout Interface...')">Pay via Credit/Debit Card</button>
            </div>
        </div>
    </div>

    <!-- 📩 Contact Us / Ask a Doubt Section -->
    <section class="contact-section">
        <h2>📩 Contact Us / Ask a Doubt</h2>
        <form action="https://formspree.io/f/xoevnbkz" method="POST">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message / Doubt:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </section>

    <script>
        var masterOverlay = document.getElementById("enrollmentOverlay");
        var headingText = document.getElementById("dynamicModalTitle");
        var dataForm = document.getElementById("enrollCaptureForm");
        var payBox = document.getElementById("gatewayHub");

        function triggerEnrollment(courseName) {
            masterOverlay.style.display = "block";
            headingText.innerText = "Enroll in " + courseName;
            dataForm.style.display = "block";
            payBox.style.display = "none";
        }

        function shutEnrollmentModal() {
            masterOverlay.style.display = "none";
        }

        function goPay(e) {
            e.preventDefault();
            dataForm.style.display = "none";
            payBox.style.display = "block";
        }

        window.onclick = function(event) {
            if (event.target == masterOverlay) {
                masterOverlay.style.display = "none";
            }
        }
    </script>
</body>
</html>
